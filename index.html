<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starfinder - Twik Interface</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --agree: #27ae60; --disagree: #e74c3c; --sad: #3498db; --panic: #f39c12;
            --chat: #9b59b6; --accent: #00d4ff;
            --success: #27ae60; --danger: #e74c3c;
            --fight-punch: #e74c3c; --fight-kick: #f39c12; --fight-block: #3498db;
            --fight-dodge: #27ae60; --fight-grapple: #9b59b6;
            --spell: #9b59b6;
            --bg: #0a0e14; --panel: #141920;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

        .view-controls {
            position: fixed; top: 0; left: 0; right: 0; background: rgba(10,14,20,0.95);
            border-bottom: 2px solid var(--accent); padding: 10px; z-index: 1000;
            display: flex; justify-content: center; gap: 8px;
        }
        .view-btn {
            padding: 8px 16px; border: 2px solid #34495e; background: transparent; color: white;
            border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85em;
            -webkit-tap-highlight-color: transparent;
        }
        .view-btn:active { transform: scale(0.95); }
        .view-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

        .app-container { display: flex; height: 100vh; padding-top: 60px; }
        .panel { flex: 1; padding: 15px; overflow-y: auto; -webkit-overflow-scrolling: touch; min-width: 0; }
        .panel.hidden-panel { display: none; }
        .panel-divider { width: 4px; background: linear-gradient(to bottom, transparent, var(--accent), transparent); }
        .panel-divider.hidden-divider { width: 0; opacity: 0; }

        .panel-header {
            font-size: 1.3em; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px;
            border-bottom: 2px solid; display: flex; justify-content: space-between; align-items: center;
        }
        .twik-header { color: var(--agree); border-color: var(--agree); }
        .gm-header { color: var(--danger); border-color: var(--danger); }
        .collapse-btn { background: transparent; border: 1px solid currentColor; color: inherit; padding: 4px 8px; border-radius: 4px; font-size: 0.7em; }

        .connection-hub {
            background: var(--panel); border-radius: 12px; padding: 15px; margin-bottom: 15px;
            border: 2px solid #2c3e50;
        }
        .connected { border-color: var(--success); }

        .status-indicator {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
            border-radius: 20px; font-weight: bold; font-size: 0.9em; margin-bottom: 15px;
        }
        .status-disconnected { background: rgba(231,76,60,0.2); color: var(--danger); }
        .status-connected { background: rgba(39,174,96,0.2); color: var(--success); }

        .btn {
            padding: 12px; border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; -webkit-tap-highlight-color: transparent; width: 100%; margin-bottom: 8px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--accent); color: var(--bg); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: #34495e; color: white; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-group .btn { flex: 1; min-width: 80px; margin-bottom: 0; }

        input[type="text"], input[type="number"] {
            background: #0f1419; border: 2px solid #34495e; color: white;
            padding: 12px; border-radius: 6px; font-size: 16px; width: 100%; margin-bottom: 8px;
            -webkit-appearance: none;
        }

        .card {
            background: var(--panel); border-radius: 10px; padding: 15px; margin-bottom: 15px;
            border-left: 4px solid;
        }
        .card-header { font-weight: bold; margin-bottom: 10px; text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px; }

        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .status-btn {
            padding: 20px 5px; border-radius: 10px; border: 3px solid; background: rgba(0,0,0,0.3);
            color: white; font-weight: bold; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; gap: 5px; -webkit-tap-highlight-color: transparent;
        }
        .status-btn.agree { border-color: var(--agree); }
        .status-btn.disagree { border-color: var(--disagree); }
        .status-btn.sad { border-color: var(--sad); }
        .status-btn.panic { border-color: var(--panic); animation: panic-pulse 2s infinite; }

        .chat-container { display: flex; flex-direction: column; height: 180px; }
        .chat-messages {
            flex: 1; overflow-y: auto; background: #0f1419; border-radius: 8px;
            padding: 10px; margin-bottom: 10px; border: 1px solid #34495e;
            -webkit-overflow-scrolling: touch; font-size: 0.95em;
        }
        .log-entry { margin: 4px 0; padding: 6px 10px; border-radius: 6px; word-wrap: break-word; }
        
        /* Status log colors */
        .log-status-agree { background: rgba(39,174,96,0.2); border-left: 3px solid var(--agree); color: #2ecc71; }
        .log-status-disagree { background: rgba(231,76,60,0.2); border-left: 3px solid var(--disagree); color: #e74c3c; }
        .log-status-sad { background: rgba(52,152,219,0.2); border-left: 3px solid var(--sad); color: #5dade2; }
        .log-status-panic { background: rgba(243,156,18,0.2); border-left: 3px solid var(--panic); color: #f5b041; animation: panic-glow 2s infinite; }
        
        @keyframes panic-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(243,156,18,0.3); }
            50% { box-shadow: 0 0 15px rgba(243,156,18,0.6); }
        }
        
        .log-chat-tw { background: #2980b9; margin-left: 20%; text-align: right; }
        .log-chat-gm { background: #34495e; margin-right: 20%; }
        .log-spell { background: rgba(155,89,182,0.2); border-left: 3px solid var(--spell); color: #d2b4de; }
        .log-roll { background: rgba(230,126,34,0.2); border-left: 3px solid var(--dice); color: #f5b041; }
        .log-combat { background: rgba(255,0,102,0.1); border: 1px solid #ff0066; text-align: center; font-weight: bold; }
        .log-system { color: #7f8c8d; font-style: italic; text-align: center; font-size: 0.9em; }

        .chat-input-group { display: flex; gap: 8px; }
        .chat-input-group input { flex: 1; margin-bottom: 0; }
        .chat-input-group .btn { width: auto; padding: 12px 20px; }

        .d20-section { display: flex; gap: 8px; align-items: stretch; }
        .d20-section input { flex: 1; margin-bottom: 0; text-align: center; font-weight: bold; }
        .d20-section .btn { width: auto; min-width: 80px; margin-bottom: 0; background: var(--dice); }

        .spells-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .spell-btn {
            padding: 15px 8px; border: 2px solid var(--spell); background: rgba(155,89,182,0.1);
            color: white; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; gap: 4px; font-size: 0.85em; -webkit-tap-highlight-color: transparent;
        }
        .spell-btn:active { transform: scale(0.95); background: rgba(155,89,182,0.3); }
        .spell-icon { font-size: 1.5em; }

        /* Tekken 69 Arena */
        .combat-arena {
            background: #050810; border: 3px solid #ff0066; border-radius: 12px;
            padding: 20px; margin-top: 20px; position: relative; overflow: hidden;
        }
        .combat-title {
            text-align: center; color: #ff0066; font-weight: bold; font-size: 1.2em;
            margin-bottom: 15px; letter-spacing: 3px; text-shadow: 0 0 10px #ff0066;
        }

        .fighters-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            height: 80px; 
            margin-bottom: 20px; 
            padding: 0 40px; 
            position: relative;
        }
        
        /* Stick Figure Twik - Green */
        .stick-twik {
            width: 3px;
            height: 30px;
            background: #2ecc71;
            position: relative;
            border-radius: 2px;
            box-shadow: -6px 20px 0 -1px #2ecc71, 6px 20px 0 -1px #2ecc71; /* Legs */
        }

        .stick-twik::before {
            content: '';
            position: absolute;
            top: -14px;
            left: -6px;
            width: 14px;
            height: 14px;
            border: 3px solid #2ecc71;
            border-radius: 50%;
            background: transparent;
        }

        .stick-twik::after {
            content: '';
            position: absolute;
            top: 8px;
            left: -13px;
            width: 28px;
            height: 3px;
            background: #2ecc71;
            border-radius: 2px;
        }

        /* Stick Figure GM - Red */
        .stick-gm {
            width: 3px;
            height: 30px;
            background: #e74c3c;
            position: relative;
            border-radius: 2px;
            box-shadow: -6px 20px 0 -1px #e74c3c, 6px 20px 0 -1px #e74c3c; /* Legs */
        }

        .stick-gm::before {
            content: '';
            position: absolute;
            top: -14px;
            left: -6px;
            width: 14px;
            height: 14px;
            border: 3px solid #e74c3c;
            border-radius: 50%;
            background: transparent;
        }

        .stick-gm::after {
            content: '';
            position: absolute;
            top: 8px;
            left: -13px;
            width: 28px;
            height: 3px;
            background: #e74c3c;
            border-radius: 2px;
        }

        @keyframes attack-left { 
            0% { transform: translateX(0) rotate(0deg); } 
            50% { transform: translateX(40px) rotate(-5deg); } 
            100% { transform: translateX(0) rotate(0deg); } 
        }
        @keyframes attack-right { 
            0% { transform: translateX(0) rotate(0deg); } 
            50% { transform: translateX(-40px) rotate(5deg); } 
            100% { transform: translateX(0) rotate(0deg); } 
        }
        @keyframes hurt { 
            0%, 100% { transform: translateX(0); } 
            25% { transform: translateX(-8px) rotate(-10deg); } 
            75% { transform: translateX(8px) rotate(10deg); } 
        }
        @keyframes victory { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-15px); } 
        }
        @keyframes draw { 
            0%, 100% { transform: scale(1); } 
            50% { transform: scale(1.1); } 
        }
        @keyframes block-both { 
            0%, 100% { transform: scale(1); opacity: 1; } 
            50% { transform: scale(0.9); opacity: 0.7; } 
        }

        .fighter-attack-left { animation: attack-left 0.4s ease-in-out; }
        .fighter-attack-right { animation: attack-right 0.4s ease-in-out; }
        .fighter-hurt { animation: hurt 0.4s ease-in-out; }
        .fighter-victory { animation: victory 0.5s ease-in-out infinite; }
        .fighter-draw { animation: draw 0.4s ease-in-out; }
        .fighter-block { animation: block-both 0.4s ease-in-out; }

        .hp-bar-container { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 10px; font-size: 0.8em; }
        .hp-label { flex: 1; text-align: center; }
        .hp-bar {
            height: 8px; background: #000; border-radius: 4px; overflow: hidden;
            margin-top: 5px; border: 1px solid #34495e;
        }
        .hp-fill { height: 100%; transition: width 0.5s ease; }
        .hp-fill.twik { background: #2ecc71; }
        .hp-fill.gm { background: #e74c3c; }

        .move-selection { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 15px; }
        .move-btn {
            padding: 12px 2px; border: 2px solid; border-radius: 6px; background: rgba(0,0,0,0.5);
            color: white; font-size: 0.7em; font-weight: bold; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; -webkit-tap-highlight-color: transparent;
        }
        .move-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .move-btn.selected { box-shadow: 0 0 15px currentColor; transform: scale(1.05); border-width: 3px; }
        .move-btn.waiting { opacity: 0.6; }
        .move-btn.punch { border-color: var(--fight-punch); color: var(--fight-punch); }
        .move-btn.kick { border-color: var(--fight-kick); color: var(--fight-kick); }
        .move-btn.block { border-color: var(--fight-block); color: var(--fight-block); }
        .move-btn.dodge { border-color: var(--fight-dodge); color: var(--fight-dodge); }
        .move-btn.grapple { border-color: var(--fight-grapple); color: var(--fight-grapple); }

        .combat-log { text-align: center; padding: 10px; font-size: 0.95em; min-height: 40px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .combat-log.draw { color: #f39c12; }
        .combat-log.twik-wins { color: #2ecc71; }
        .combat-log.gm-wins { color: #e74c3c; }
        
        .hidden { display: none !important; }
        
        @media (max-width: 400px) {
            .spells-grid { grid-template-columns: 1fr; }
            .move-selection { grid-template-columns: repeat(3, 1fr); }
            .fighters-container { padding: 0 20px; }
        }
    </style>
</head>
<body>

<div class="view-controls">
    <button class="view-btn active" onclick="setView('split')" id="btn-split"><span>↔️</span> Split</button>
    <button class="view-btn" onclick="setView('twik')" id="btn-twik"><span>🐱</span> Twik</button>
    <button class="view-btn" onclick="setView('gm')" id="btn-gm"><span>🎲</span> GM</button>
</div>

<div class="app-container view-split" id="appContainer">
    <!-- TWIK PANEL -->
    <div class="panel expanded" id="twikPanel">
        <div class="panel-header twik-header">
            <div>🐱 Twik</div>
            <button class="collapse-btn" onclick="setView('gm')">Hide →</button>
        </div>

        <div class="connection-hub" id="twikConnectionHub">
            <div class="status-indicator status-disconnected" id="twikStatus">● Offline</div>
            
            <div class="firebase-config" id="twikConfig">
                <h3 style="color: #ffc107; margin-bottom: 10px;">🔥 Firebase Setup</h3>
                <input type="text" id="twikApiKey" placeholder="API Key">
                <input type="text" id="twikDatabaseUrl" placeholder="Database URL">
                <button class="btn btn-primary" onclick="initTwikFirebase()">Connect</button>
            </div>

            <div id="twikSetup" class="hidden">
                <div class="btn-group">
                    <button class="btn btn-success" onclick="twikHost()">📡 HOST</button>
                    <button class="btn btn-secondary" onclick="showJoin()">🔗 JOIN</button>
                </div>
            </div>

            <div id="twikHostArea" class="hidden">
                <div style="background: #000; border: 2px dashed var(--accent); padding: 15px; text-align: center; margin-bottom: 10px; border-radius: 8px;" onclick="copyCode()">
                    <div style="font-size: 0.8em; color: #7f8c8d;">Room Code:</div>
                    <div style="font-family: monospace; font-size: 1.3em; color: var(--accent);" id="twikRoomCode">...</div>
                </div>
                <button class="btn btn-danger" onclick="twikDisconnect()">Cancel</button>
            </div>

            <div id="twikJoinArea" class="hidden">
                <input type="text" id="twikJoinInput" placeholder="Enter room code">
                <div class="btn-group">
                    <button class="btn btn-success" onclick="twikJoin()">Connect</button>
                    <button class="btn btn-secondary" onclick="backToSetup()">Back</button>
                </div>
            </div>
        </div>

        <div id="twikMain" class="hidden">
            <!-- Status -->
            <div class="card" style="border-color: var(--agree);">
                <div class="card-header" style="color: var(--agree);">Status</div>
                <div class="status-grid">
                    <button class="status-btn agree" onclick="sendStatus('agree', 'Twik agrees')"><span>👍</span><span>Agree</span></button>
                    <button class="status-btn disagree" onclick="sendStatus('disagree', 'Twik disagrees')"><span>👎</span><span>Disagree</span></button>
                    <button class="status-btn sad" onclick="sendStatus('sad', 'Twik is sad')"><span>😿</span><span>Sad</span></button>
                    <button class="status-btn panic" onclick="sendStatus('panic', 'Twik panics!')"><span>😰</span><span>Panic</span></button>
                </div>
            </div>

            <!-- Chat -->
            <div class="card" style="border-color: var(--chat);">
                <div class="card-header" style="color: var(--chat);">Chat</div>
                <div class="chat-container">
                    <div class="chat-messages" id="twikChatBox">
                        <div class="log-system">Connected to GM</div>
                    </div>
                    <div class="chat-input-group">
                        <input type="text" id="twikChatInput" placeholder="Message...">
                        <button class="btn btn-primary" onclick="sendChat()">Send</button>
                    </div>
                </div>
            </div>

            <!-- D20 Roll -->
            <div class="card" style="border-color: var(--dice);">
                <div class="card-header" style="color: var(--dice);">D20 Roll</div>
                <div class="d20-section">
                    <input type="number" id="d20Mod" placeholder="+0" value="0">
                    <button class="btn" onclick="rollD20()">Roll</button>
                </div>
            </div>

            <!-- Spells -->
            <div class="card" style="border-color: var(--spell);">
                <div class="card-header" style="color: var(--spell);">Spells</div>
                <div class="spells-grid">
                    <button class="spell-btn" onclick="castSpell('Sift the sphere')"><span class="spell-icon">🔮</span><span>Sift the sphere</span></button>
                    <button class="spell-btn" onclick="castSpell('Suggestion')"><span class="spell-icon">💭</span><span>Suggestion</span></button>
                    <button class="spell-btn" onclick="castSpell('Rewrite memory')"><span class="spell-icon">🧠</span><span>Rewrite memory</span></button>
                    <button class="spell-btn" onclick="castSpell('Mind probe')"><span class="spell-icon">👁️</span><span>Mind probe</span></button>
                    <button class="spell-btn" onclick="castSpell('Hallucination')"><span class="spell-icon">🌈</span><span>Hallucination</span></button>
                    <button class="spell-btn" onclick="castSpell('Talking corpse')"><span class="spell-icon">💀</span><span>Talking corpse</span></button>
                    <button class="spell-btn" onclick="castSpell('Translocate')"><span class="spell-icon">⚡</span><span>Translocate</span></button>
                </div>
            </div>

            <!-- Tekken 69 Arena -->
            <div class="combat-arena">
                <div class="combat-title">👊 TEKKEN 69 👊</div>
                
                <div class="hp-bar-container">
                    <div class="hp-label">Twik<br><div class="hp-bar"><div class="hp-fill twik" id="twikHpBar" style="width: 100%"></div></div></div>
                    <div class="hp-label">GM<br><div class="hp-bar"><div class="hp-fill gm" id="gmHpBar" style="width: 100%"></div></div></div>
                </div>

                <div class="fighters-container">
                    <div class="stick-twik" id="twikFighter"></div>
                    <div class="stick-gm" id="gmFighter"></div>
                </div>

                <div class="combat-log" id="combatLog">Select your move!</div>

                <div class="move-selection">
                    <button class="move-btn punch" onclick="selectMove('punch')" id="btn-punch"><span style="font-size: 1.2em;">👊</span>PUNCH</button>
                    <button class="move-btn kick" onclick="selectMove('kick')" id="btn-kick"><span style="font-size: 1.2em;">🦶</span>KICK</button>
                    <button class="move-btn block" onclick="selectMove('block')" id="btn-block"><span style="font-size: 1.2em;">🛡️</span>BLOCK</button>
                    <button class="move-btn dodge" onclick="selectMove('dodge')" id="btn-dodge"><span style="font-size: 1.2em;">💨</span>DODGE</button>
                    <button class="move-btn grapple" onclick="selectMove('grapple')" id="btn-grapple"><span style="font-size: 1.2em;">🤼</span>GRAPPLE</button>
                </div>

                <button class="btn btn-secondary" onclick="resetCombat()" style="margin-top: 10px; margin-bottom: 0; font-size: 0.9em;">Reset Fight</button>
            </div>

            <button class="btn btn-danger" onclick="twikDisconnect()">Disconnect</button>
        </div>
    </div>

    <div class="panel-divider" id="panelDivider"></div>

    <!-- GM PANEL -->
    <div class="panel expanded" id="gmPanel">
        <div class="panel-header gm-header">
            <button class="collapse-btn" onclick="setView('twik')">← Hide</button>
            <div>🎲 GM</div>
        </div>

        <div class="connection-hub" id="gmConnectionHub">
            <div class="status-indicator status-disconnected" id="gmStatus">● Offline</div>
            
            <div class="firebase-config" id="gmConfig">
                <h3 style="color: #ffc107; margin-bottom: 10px;">🔥 Firebase Setup</h3>
                <input type="text" id="gmApiKey" placeholder="API Key">
                <input type="text" id="gmDatabaseUrl" placeholder="Database URL">
                <button class="btn btn-primary" onclick="initGmFirebase()">Connect</button>
            </div>

            <div id="gmSetup" class="hidden">
                <div class="btn-group">
                    <button class="btn btn-success" onclick="gmHost()">🎮 HOST</button>
                    <button class="btn btn-secondary" onclick="showGmJoin()">🔗 JOIN</button>
                </div>
            </div>

            <div id="gmHostArea" class="hidden">
                <div style="background: #000; border: 2px dashed var(--accent); padding: 15px; text-align: center; margin-bottom: 10px; border-radius: 8px;" onclick="copyGmCode()">
                    <div style="font-size: 0.8em; color: #7f8c8d;">Room Code:</div>
                    <div style="font-family: monospace; font-size: 1.3em; color: var(--accent);" id="gmRoomCode">...</div>
                </div>
                <button class="btn btn-danger" onclick="gmDisconnect()">Cancel</button>
            </div>

            <div id="gmJoinArea" class="hidden">
                <input type="text" id="gmJoinInput" placeholder="Enter room code">
                <div class="btn-group">
                    <button class="btn btn-success" onclick="gmJoin()">Connect</button>
                    <button class="btn btn-secondary" onclick="backGmSetup()">Back</button>
                </div>
            </div>
        </div>

        <div id="gmMain" class="hidden">
            <!-- GM Tekken View -->
            <div class="combat-arena">
                <div class="combat-title">👊 TEKKEN 69 👊</div>
                
                <div class="hp-bar-container">
                    <div class="hp-label">Twik<br><div class="hp-bar"><div class="hp-fill twik" id="gmTwikHpBar" style="width: 100%"></div></div></div>
                    <div class="hp-label">GM<br><div class="hp-bar"><div class="hp-fill gm" id="gmGmHpBar" style="width: 100%"></div></div></div>
                </div>

                <div class="fighters-container">
                    <div class="stick-twik" id="gmTwikFighter"></div>
                    <div class="stick-gm" id="gmGmFighter"></div>
                </div>

                <div class="combat-log" id="gmCombatLog">Waiting for moves...</div>

                <div class="move-selection">
                    <button class="move-btn punch" onclick="gmSelectMove('punch')" id="gm-btn-punch"><span style="font-size: 1.2em;">👊</span>PUNCH</button>
                    <button class="move-btn kick" onclick="gmSelectMove('kick')" id="gm-btn-kick"><span style="font-size: 1.2em;">🦶</span>KICK</button>
                    <button class="move-btn block" onclick="gmSelectMove('block')" id="gm-btn-block"><span style="font-size: 1.2em;">🛡️</span>BLOCK</button>
                    <button class="move-btn dodge" onclick="gmSelectMove('dodge')" id="gm-btn-dodge"><span style="font-size: 1.2em;">💨</span>DODGE</button>
                    <button class="move-btn grapple" onclick="gmSelectMove('grapple')" id="gm-btn-grapple"><span style="font-size: 1.2em;">🤼</span>GRAPPLE</button>
                </div>

                <button class="btn btn-secondary" onclick="resetCombat()" style="margin-top: 10px; margin-bottom: 0; font-size: 0.9em;">Reset Fight</button>
            </div>

            <!-- GM Chat -->
            <div class="card" style="border-color: var(--chat);">
                <div class="card-header" style="color: var(--chat);">Message Twik</div>
                <div class="chat-input-group">
                    <input type="text" id="gmChatInput" placeholder="Message...">
                    <button class="btn btn-primary" onclick="gmSendChat()">Send</button>
                </div>
            </div>

            <!-- GM Log -->
            <div class="card">
                <div class="card-header" style="color: var(--accent);">Activity Log</div>
                <div class="chat-messages" id="gmLog" style="height: 300px;">
                    <div class="log-system">Waiting for Twik...</div>
                </div>
            </div>

            <button class="btn btn-danger" onclick="gmDisconnect()">Disconnect</button>
        </div>
    </div>
</div>

<script>
// Firebase refs
let twikDb = null, twikRoom = null, gmDb = null, gmRoom = null, roomId = null;
let isTwik = false;

// Combat state
let combat = { twikHp: 100, gmHp: 100, twikMove: null, gmMove: null, round: 1, over: false, processed: false };

// Combat rules
const RULES = {
    punch: { beats: ['dodge', 'grapple'], name: 'Punch' },
    kick: { beats: ['block', 'punch'], name: 'Kick' },
    block: { beats: ['grapple', 'punch'], name: 'Block' },
    dodge: { beats: ['kick', 'block'], name: 'Dodge' },
    grapple: { beats: ['kick', 'dodge'], name: 'Grapple' }
};

// Status sounds
const STATUS_SOUNDS = {
    agree: [440, 554, 659],
    disagree: [300, 250, 200],
    sad: [330, 294, 262],
    panic: [880, 440, 880, 440]
};

function setView(mode) {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + mode).classList.add('active');
    
    const t = document.getElementById('twikPanel');
    const g = document.getElementById('gmPanel');
    const d = document.getElementById('panelDivider');
    
    if (mode === 'split') { t.classList.remove('hidden-panel'); g.classList.remove('hidden-panel'); d.classList.remove('hidden-divider'); }
    else if (mode === 'twik') { t.classList.remove('hidden-panel'); g.classList.add('hidden-panel'); d.classList.add('hidden-divider'); }
    else { t.classList.add('hidden-panel'); g.classList.remove('hidden-panel'); d.classList.add('hidden-divider'); }
    
    localStorage.setItem('view', mode);
}

const saved = localStorage.getItem('view');
if (saved) setView(saved);

function initTwikFirebase() {
    try {
        const app = firebase.initializeApp({
            apiKey: document.getElementById('twikApiKey').value,
            databaseURL: document.getElementById('twikDatabaseUrl').value
        }, 'twik');
        twikDb = firebase.database(app);
        document.getElementById('twikConfig').classList.add('hidden');
        document.getElementById('twikSetup').classList.remove('hidden');
    } catch(e) { alert('Error: ' + e.message); }
}

function initGmFirebase() {
    try {
        const app = firebase.initializeApp({
            apiKey: document.getElementById('gmApiKey').value,
            databaseURL: document.getElementById('gmDatabaseUrl').value
        }, 'gm');
        gmDb = firebase.database(app);
        document.getElementById('gmConfig').classList.add('hidden');
        document.getElementById('gmSetup').classList.remove('hidden');
    } catch(e) { alert('Error: ' + e.message); }
}

// Twik functions
function twikHost() {
    if (!twikDb) return;
    roomId = 'room_' + Math.random().toString(36).substr(2, 8);
    twikRoom = twikDb.ref('rooms/' + roomId);
    isTwik = true;
    
    document.getElementById('twikSetup').classList.add('hidden');
    document.getElementById('twikHostArea').classList.remove('hidden');
    document.getElementById('twikRoomCode').textContent = roomId;
    
    combat = { twikHp: 100, gmHp: 100, twikMove: null, gmMove: null, round: 1, over: false, processed: false };
    twikRoom.child('combat').set(combat);
    initCombatListeners();
    
    twikRoom.child('gmConnected').on('value', snap => {
        if (snap.val()) {
            document.getElementById('twikConnectionHub').classList.add('connected');
            document.getElementById('twikHostArea').classList.add('hidden');
            document.getElementById('twikMain').classList.remove('hidden');
            document.getElementById('twikStatus').textContent = '● Connected';
            document.getElementById('twikStatus').className = 'status-indicator status-connected';
            logMessage('twikChatBox', 'Connected to GM', 'system');
        }
    });
    
    twikRoom.child('messages').on('child_added', snap => {
        const m = snap.val();
        if (m && m.from === 'gm' && m.type === 'chat') logMessage('twikChatBox', 'GM: ' + m.msg, 'chat-gm');
    });
    
    twikRoom.child('twikConnected').set(true);
}

function showJoin() {
    document.getElementById('twikSetup').classList.add('hidden');
    document.getElementById('twikJoinArea').classList.remove('hidden');
}

function twikJoin() {
    const code = document.getElementById('twikJoinInput').value.trim();
    if (!code) return;
    roomId = code;
    twikRoom = twikDb.ref('rooms/' + roomId);
    isTwik = true;
    
    twikRoom.once('value').then(snap => {
        if (snap.exists()) {
            twikRoom.child('twikConnected').set(true);
            document.getElementById('twikConnectionHub').classList.add('connected');
            document.getElementById('twikJoinArea').classList.add('hidden');
            document.getElementById('twikMain').classList.remove('hidden');
            document.getElementById('twikStatus').textContent = '● Connected';
            document.getElementById('twikStatus').className = 'status-indicator status-connected';
            initCombatListeners();
            twikRoom.child('messages').on('child_added', snap => {
                const m = snap.val();
                if (m && m.from === 'gm' && m.type === 'chat') logMessage('twikChatBox', 'GM: ' + m.msg, 'chat-gm');
            });
            logMessage('twikChatBox', 'Connected to GM', 'system');
        } else {
            alert('Room not found');
        }
    });
}

function backToSetup() {
    document.getElementById('twikJoinArea').classList.add('hidden');
    document.getElementById('twikSetup').classList.remove('hidden');
}

function twikDisconnect() { 
    if (twikRoom) twikRoom.child('twikConnected').set(false); 
    location.reload(); 
}

// GM functions
function gmHost() {
    if (!gmDb) return;
    roomId = 'room_' + Math.random().toString(36).substr(2, 8);
    gmRoom = gmDb.ref('rooms/' + roomId);
    isTwik = false;
    
    document.getElementById('gmSetup').classList.add('hidden');
    document.getElementById('gmHostArea').classList.remove('hidden');
    document.getElementById('gmRoomCode').textContent = roomId;
    
    combat = { twikHp: 100, gmHp: 100, twikMove: null, gmMove: null, round: 1, over: false, processed: false };
    gmRoom.child('combat').set(combat);
    initCombatListeners();
    
    gmRoom.child('twikConnected').on('value', snap => {
        if (snap.val()) {
            gmRoom.child('gmConnected').set(true);
            document.getElementById('gmConnectionHub').classList.add('connected');
            document.getElementById('gmHostArea').classList.add('hidden');
            document.getElementById('gmMain').classList.remove('hidden');
            document.getElementById('gmStatus').textContent = '● Connected';
            document.getElementById('gmStatus').className = 'status-indicator status-connected';
            initGmListeners();
        }
    });
}

function showGmJoin() {
    document.getElementById('gmSetup').classList.add('hidden');
    document.getElementById('gmJoinArea').classList.remove('hidden');
}

function gmJoin() {
    const code = document.getElementById('gmJoinInput').value.trim();
    if (!code) return;
    roomId = code;
    gmRoom = gmDb.ref('rooms/' + code);
    isTwik = false;
    
    gmRoom.once('value').then(snap => {
        if (snap.exists()) {
            gmRoom.child('gmConnected').set(true);
            document.getElementById('gmConnectionHub').classList.add('connected');
            document.getElementById('gmJoinArea').classList.add('hidden');
            document.getElementById('gmMain').classList.remove('hidden');
            document.getElementById('gmStatus').textContent = '● Connected';
            document.getElementById('gmStatus').className = 'status-indicator status-connected';
            initCombatListeners();
            initGmListeners();
        } else {
            alert('Room not found');
        }
    });
}

function backGmSetup() {
    document.getElementById('gmJoinArea').classList.add('hidden');
    document.getElementById('gmSetup').classList.remove('hidden');
}

function gmDisconnect() { 
    if (gmRoom) gmRoom.child('gmConnected').set(false); 
    location.reload(); 
}

function initGmListeners() {
    gmRoom.child('messages').on('child_added', snap => {
        const m = snap.val();
        if (!m) return;
        
        if (m.type === 'status') logMessage('gmLog', 'Twik ' + m.msg.toLowerCase().replace('twik ', ''), 'status-' + m.statusType);
        else if (m.type === 'chat' && m.from === 'twik') logMessage('gmLog', 'Twik: ' + m.msg, 'chat-tw');
        else if (m.type === 'spell') logMessage('gmLog', 'Twik cast: ' + m.spell, 'spell');
        else if (m.type === 'roll') logMessage('gmLog', m.msg, 'roll');
        else if (m.type === 'combat') logMessage('gmLog', m.result, 'combat');
    });
}

// Actions
function sendStatus(type, msg) {
    if (!twikRoom) return;
    // Store both type and msg for colored logging
    twikRoom.child('messages').push({ type: 'status', statusType: type, msg: msg, from: 'twik', timestamp: Date.now() });
    logMessage('twikChatBox', msg, 'status-' + type);
    playStatusSound(type);
}

function sendChat() {
    const input = document.getElementById('twikChatInput');
    const msg = input.value.trim();
    if (!msg || !twikRoom) return;
    twikRoom.child('messages').push({ type: 'chat', msg: msg, from: 'twik', timestamp: Date.now() });
    logMessage('twikChatBox', 'You: ' + msg, 'chat-tw');
    input.value = '';
}

function gmSendChat() {
    const input = document.getElementById('gmChatInput');
    const msg = input.value.trim();
    if (!msg || !gmRoom) return;
    gmRoom.child('messages').push({ type: 'chat', msg: msg, from: 'gm', timestamp: Date.now() });
    logMessage('gmLog', 'You: ' + msg, 'chat-gm');
    input.value = '';
}

function rollD20() {
    if (!twikRoom) return;
    const mod = parseInt(document.getElementById('d20Mod').value) || 0;
    const roll = Math.floor(Math.random() * 20) + 1;
    const total = roll + mod;
    const msg = 'Twik rolled: ' + total + ' (D20+' + mod + ')';
    twikRoom.child('messages').push({ type: 'roll', msg: msg, from: 'twik', timestamp: Date.now() });
    logMessage('twikChatBox', msg, 'roll');
}

function castSpell(name) {
    if (!twikRoom) return;
    twikRoom.child('messages').push({ type: 'spell', spell: name, from: 'twik', timestamp: Date.now() });
    logMessage('twikChatBox', 'Cast: ' + name, 'spell');
}

function logMessage(boxId, text, type) {
    const box = document.getElementById(boxId);
    const div = document.createElement('div');
    div.className = 'log-entry log-' + type;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    
    while (box.children.length > 50) box.removeChild(box.firstChild);
}

function playStatusSound(type) {
    const notes = STATUS_SOUNDS[type];
    if (!notes) return;
    
    try {
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        notes.forEach((freq, i) => {
            setTimeout(() => {
                const osc = audio.createOscillator();
                const gain = audio.createGain();
                osc.connect(gain);
                gain.connect(audio.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.2);
                osc.start();
                osc.stop(audio.currentTime + 0.2);
            }, i * 100);
        });
    } catch(e) {}
}

// Combat functions
function initCombatListeners() {
    const room = twikRoom || gmRoom;
    if (!room) return;
    
    room.child('combat').on('value', snap => {
        const data = snap.val();
        if (!data) return;
        
        combat = {
            twikHp: data.twikHp || 100,
            gmHp: data.gmHp || 100,
            twikMove: data.twikMove || null,
            gmMove: data.gmMove || null,
            round: data.round || 1,
            over: data.over || false,
            processed: data.processed || false,
            lastResult: data.lastResult || null
        };
        
        updateCombatUI();
        
        if (combat.twikMove && combat.gmMove && !combat.processed) {
            resolveCombat();
        }
    });
}

function updateCombatUI() {
    // Update HP bars
    const tHp = document.getElementById('twikHpBar');
    const gHp = document.getElementById('gmHpBar');
    const gmTHp = document.getElementById('gmTwikHpBar');
    const gmGHp = document.getElementById('gmGmHpBar');
    
    if (tHp) tHp.style.width = combat.twikHp + '%';
    if (gHp) gHp.style.width = combat.gmHp + '%';
    if (gmTHp) gmTHp.style.width = combat.twikHp + '%';
    if (gmGHp) gmGHp.style.width = combat.gmHp + '%';
    
    // Update Twik's buttons
    if (isTwik) {
        const moves = ['punch', 'kick', 'block', 'dodge', 'grapple'];
        moves.forEach(move => {
            const btn = document.getElementById('btn-' + move);
            if (btn) {
                const shouldDisable = (combat.twikMove != null) || combat.over;
                btn.disabled = shouldDisable;
                btn.classList.remove('selected');
                
                if (combat.twikMove === move) {
                    btn.classList.add('selected');
                }
            }
        });
        
        const log = document.getElementById('combatLog');
        if (log) {
            if (combat.twikMove && !combat.gmMove) {
                log.textContent = 'You chose ' + RULES[combat.twikMove].name + '. Waiting for GM...';
            } else if (!combat.twikMove && combat.gmMove) {
                log.textContent = 'GM is ready. Your turn!';
            } else if (!combat.twikMove && !combat.gmMove) {
                log.textContent = 'Select your move!';
            }
        }
    }
    
    // Update GM's buttons
    if (!isTwik) {
        const moves = ['punch', 'kick', 'block', 'dodge', 'grapple'];
        moves.forEach(move => {
            const btn = document.getElementById('gm-btn-' + move);
            if (btn) {
                const shouldDisable = (combat.gmMove != null) || combat.over;
                btn.disabled = shouldDisable;
                btn.classList.remove('selected');
                
                if (combat.gmMove === move) {
                    btn.classList.add('selected');
                }
            }
        });
        
        const log = document.getElementById('gmCombatLog');
        if (log) {
            if (combat.gmMove && !combat.twikMove) {
                log.textContent = 'You chose ' + RULES[combat.gmMove].name + '. Waiting for Twik...';
            } else if (!combat.gmMove && combat.twikMove) {
                log.textContent = 'Twik is ready. Your turn!';
            } else if (!combat.gmMove && !combat.twikMove) {
                log.textContent = 'Select your move!';
            }
        }
    }
}

function selectMove(move) {
    if (!twikRoom || combat.twikMove != null || combat.over || !isTwik) {
        return;
    }
    twikRoom.child('combat').update({ twikMove: move });
}

function gmSelectMove(move) {
    if (!gmRoom || combat.gmMove != null || combat.over || isTwik) {
        return;
    }
    gmRoom.child('combat').update({ gmMove: move });
}

function resolveCombat() {
    const { twikMove, gmMove } = combat;
    let result = '';
    let winner = null;
    let isDraw = false;
    
    if (twikMove === gmMove) {
        result = 'DRAW! Both used ' + RULES[twikMove].name + ' - Cancelled!';
        isDraw = true;
        winner = 'draw';
    } else if (RULES[twikMove].beats.includes(gmMove)) {
        result = 'Twik wins! ' + RULES[twikMove].name + ' beats ' + RULES[gmMove].name;
        winner = 'twik';
        combat.gmHp = Math.max(0, combat.gmHp - 25);
    } else {
        result = 'GM wins! ' + RULES[gmMove].name + ' beats ' + RULES[twikMove].name;
        winner = 'gm';
        combat.twikHp = Math.max(0, combat.twikHp - 25);
    }
    
    if (combat.twikHp <= 0) {
        result = 'GM WINS THE MATCH!';
        combat.over = true;
    } else if (combat.gmHp <= 0) {
        result = 'TWIK WINS THE MATCH!';
        combat.over = true;
    }
    
    combat.lastResult = result;
    combat.processed = true;
    
    const room = twikRoom || gmRoom;
    room.child('combat').set(combat);
    room.child('messages').push({ type: 'combat', result: result, from: 'system', timestamp: Date.now() });
    
    const twikLog = document.getElementById('combatLog');
    const gmLog = document.getElementById('gmCombatLog');
    
    if (twikLog) {
        twikLog.textContent = result;
        twikLog.className = 'combat-log ' + (isDraw ? 'draw' : (winner === 'twik' ? 'twik-wins' : (winner === 'gm' ? 'gm-wins' : '')));
    }
    if (gmLog) {
        gmLog.textContent = result;
        gmLog.className = 'combat-log ' + (isDraw ? 'draw' : (winner === 'twik' ? 'twik-wins' : (winner === 'gm' ? 'gm-wins' : '')));
    }
    
    animateFighters(winner, isDraw);
    
    if (!combat.over) {
        setTimeout(() => {
            combat.twikMove = null;
            combat.gmMove = null;
            combat.processed = false;
            combat.round++;
            combat.lastResult = null;
            room.child('combat').update({
                twikMove: null, gmMove: null, processed: false, round: combat.round, lastResult: null
            });
            
            if (twikLog) {
                twikLog.className = 'combat-log';
                twikLog.textContent = 'Select your move!';
            }
            if (gmLog) {
                gmLog.className = 'combat-log';
                gmLog.textContent = 'Select your move!';
            }
        }, 3000);
    }
}

function animateFighters(winner, isDraw) {
    const t1 = document.getElementById('twikFighter');
    const g1 = document.getElementById('gmFighter');
    const t2 = document.getElementById('gmTwikFighter');
    const g2 = document.getElementById('gmGmFighter');
    
    [t1, g1, t2, g2].forEach(el => {
        if (el) {
            el.classList.remove('fighter-attack-left', 'fighter-attack-right', 'fighter-hurt', 'fighter-victory', 'fighter-draw', 'fighter-block');
            void el.offsetWidth;
        }
    });
    
    if (isDraw) {
        [t1, g1, t2, g2].forEach(el => el?.classList.add('fighter-block'));
    } else if (winner === 'twik') {
        if (t1) { t1.classList.add('fighter-attack-left'); setTimeout(() => t1.classList.add('fighter-victory'), 400); }
        if (g2) g2.classList.add('fighter-hurt');
        if (t2) { t2.classList.add('fighter-attack-left'); setTimeout(() => t2.classList.add('fighter-victory'), 400); }
        if (g1) g1.classList.add('fighter-hurt');
    } else if (winner === 'gm') {
        if (g1) { g1.classList.add('fighter-attack-right'); setTimeout(() => g1.classList.add('fighter-victory'), 400); }
        if (t2) t2.classList.add('fighter-hurt');
        if (g2) { g2.classList.add('fighter-attack-right'); setTimeout(() => g2.classList.add('fighter-victory'), 400); }
        if (t1) t1.classList.add('fighter-hurt');
    }
}

function resetCombat() {
    combat = { twikHp: 100, gmHp: 100, twikMove: null, gmMove: null, round: 1, over: false, processed: false, lastResult: null };
    const room = twikRoom || gmRoom;
    if (room) room.child('combat').set(combat);
    
    const twikLog = document.getElementById('combatLog');
    const gmLog = document.getElementById('gmCombatLog');
    if (twikLog) {
        twikLog.textContent = 'Select your move!';
        twikLog.className = 'combat-log';
    }
    if (gmLog) {
        gmLog.textContent = 'Select your move!';
        gmLog.className = 'combat-log';
    }
    
    document.querySelectorAll('.stick-twik, .stick-gm').forEach(el => {
        el.classList.remove('fighter-attack-left', 'fighter-attack-right', 'fighter-hurt', 'fighter-victory', 'fighter-draw', 'fighter-block');
    });
    
    updateCombatUI();
}

function copyCode() {
    const code = document.getElementById('twikRoomCode').textContent;
    navigator.clipboard.writeText(code);
}

function copyGmCode() {
    const code = document.getElementById('gmRoomCode').textContent;
    navigator.clipboard.writeText(code);
}

document.getElementById('twikChatInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') sendChat(); });
document.getElementById('gmChatInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') gmSendChat(); });
document.getElementById('twikJoinInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') twikJoin(); });
document.getElementById('gmJoinInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') gmJoin(); });
</script>
